# Deploy the static transparency site to GitHub Pages.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/log-public-key.ed25519"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Stage site
        run: |
          mkdir -p _site
          cp -a site/. _site/
          cp docs/log-public-key.ed25519 _site/pubkey.txt
          mkdir -p _site/log
          cp docs/log-public-key.ed25519 _site/log/pubkey.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # Pages OIDC; job-scoped only
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
