# Weekly Plumbline registry crawl (operator / evidence).
# Prefer systemd on a dedicated host. This workflow is a backup.
#
# Do not launch publicly. Do not tweet. Evidence only.
name: crawl-weekly

on:
  schedule:
    # Mondays 10:15 UTC
    - cron: "15 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl-weekly
  cancel-in-progress: false

jobs:
  crawl:
    if: ${{ vars.PLUMBLINE_CRAWL_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Install tools
        run: |
          go build -o plumb ./cmd/plumb
          go build -o plumbline-jail ./cmd/plumbline-jail
          sudo mv plumbline-jail /usr/local/bin/
      - name: Prepare keys and env
        env:
          SIGNING_KEY_B64: ${{ secrets.PLUMBLINE_SIGNING_KEY_B64 }}
        run: |
          mkdir -p "$HOME/.plumbline/bin" lab/runs
          echo "$SIGNING_KEY_B64" | base64 -d > "$HOME/.plumbline/signing.ed25519"
          chmod 600 "$HOME/.plumbline/signing.ed25519"
          python3 - <<'PY'
          from pathlib import Path
          p = Path.home() / ".plumbline" / "signing.ed25519"
          b = p.read_bytes()
          if len(b) != 64:
              raise SystemExit(f"signing key must be 64 raw bytes, got {len(b)}")
          Path.home().joinpath(".plumbline", "signing.ed25519.pub").write_bytes(b[32:])
          PY
          {
            echo "PLUMBLINE_CRAWL_I_UNDERSTAND=1"
            echo "PLUMBLINE_HOME=$HOME/.plumbline"
            echo "PLUMBLINE_REPO=$GITHUB_WORKSPACE"
          } > "$HOME/.plumbline/crawl.env"
      - name: Restore crawl state and log
        uses: actions/cache@v6
        with:
          path: |
            ~/.plumbline/crawl-state.json
            ~/.plumbline/crawl-log.sqlite
            ~/.plumbline/crawl-log.sqlite-wal
            ~/.plumbline/crawl-log.sqlite-shm
          key: plumbline-crawl-log-v1
      - name: Run weekly crawl
        run: |
          set -a
          # shellcheck disable=SC1090
          source "$HOME/.plumbline/crawl.env"
          set +a
          ./scripts/run-weekly-crawl.sh
      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crawl-run-${{ github.run_id }}
          path: lab/runs/
          if-no-files-found: warn
      - name: Commit lab run summaries (no private keys)
        run: |
          git config user.name "plumbline-ops"
          git config user.email "ops@users.noreply.github.com"
          git add lab/runs lab/NOTEBOOK.txt || true
          if git diff --staged --quiet; then
            echo "no lab changes"
          else
            git commit -s -m "ops: weekly crawl evidence $(date -u +%F)"
            git push
          fi
