<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server history — Plumbline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a class="brand" href="index.html">Plumbline</a>
      <a href="changes.html">Changes</a>
      <a href="server.html">Servers</a>
      <a href="taxonomy.html">Taxonomy</a>
      <a href="docs/VERIFY.html">Verify</a>
    </nav>
    <h1>Server history</h1>
    <form id="form" style="margin-bottom:1.5rem;display:flex;gap:0.5rem;flex-wrap:wrap">
      <input id="sid" type="text" placeholder="registry server id (e.g. vendor/server)"
        style="flex:1;min-width:200px;padding:0.55rem 0.7rem;border-radius:4px;border:1px solid var(--line);background:#0a1014;color:var(--ink);font-family:var(--font-mono);font-size:0.9rem">
      <button class="btn btn-primary" type="submit">Load</button>
    </form>
    <p class="meta" id="status"></p>
    <ul class="list" id="list"></ul>
  </div>
  <script src="js/base.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var sidInput = document.getElementById("sid");
      var list = document.getElementById("list");
      var status = document.getElementById("status");

      function load(id) {
        list.textContent = "";
        PlumblineUI.text(status, "Loading…");
        history.replaceState(null, "", "server.html?id=" + encodeURIComponent(id));
        PlumblineUI.getJSON("/server/history?id=" + encodeURIComponent(id))
          .then(function (data) {
            var entries = data.entries || [];
            PlumblineUI.text(status, entries.length + " observation(s) for " + data.server_id);
            entries.forEach(function (e) {
              var title = PlumblineUI.el("div", { className: "title" }, [
                e.tool_name + " · idx " + e.idx
              ]);
              var meta = PlumblineUI.el("div", { className: "meta" }, [
                e.hash + " · " + new Date(e.observed_at * 1000).toISOString()
              ]);
              var desc = PlumblineUI.el("div", { className: "desc" });
              // Decode canonical for display — ALWAYS via textContent.
              try {
                var bin = atob(e.canonical);
                var jsonStart = bin.indexOf("\n");
                var tool = jsonStart >= 0 ? bin.slice(jsonStart + 1) : bin;
                var obj = JSON.parse(tool);
                var shown = obj.description != null ? String(obj.description) : tool;
                PlumblineUI.text(desc, shown);
              } catch (ex) {
                PlumblineUI.text(desc, "(unable to decode canonical)");
              }
              var li = PlumblineUI.el("li", { className: "row" }, [title, meta, desc]);
              list.appendChild(li);
            });
          })
          .catch(function (err) {
            PlumblineUI.text(status, "");
            list.appendChild(PlumblineUI.el("li", { className: "error" }, [String(err.message || err)]));
          });
      }

      document.getElementById("form").addEventListener("submit", function (ev) {
        ev.preventDefault();
        var id = sidInput.value.trim();
        if (id) load(id);
      });

      var initial = params.get("id");
      if (initial) {
        sidInput.value = initial;
        load(initial);
      } else {
        PlumblineUI.text(status, "Enter a server id to load history.");
      }
    })();
  </script>
</body>
</html>
