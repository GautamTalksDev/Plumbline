<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify the log — Plumbline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/site.css">
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a class="brand" href="../index.html">Plumbline</a>
      <a href="../changes.html">Changes</a>
      <a href="../server.html">Servers</a>
      <a href="../taxonomy.html">Taxonomy</a>
      <a href="../docs/VERIFY.html">Verify</a>
    </nav>
    <h1>Verify the log</h1>
    <p>You do not have to trust the operator. Use the CLI against any conforming endpoint.</p>
    <div class="pubkey-panel">
      <div class="label">Public key (Ed25519 hex)</div>
      <code id="pubkey">loading…</code>
    </div>
    <pre class="taxonomy-body" id="doc">Loading…</pre>
  </div>
  <script src="../js/base.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    PlumblineUI.getJSON("/pubkey")
      .then(function (j) { PlumblineUI.text(document.getElementById("pubkey"), j.public_key); })
      .catch(function () {
        fetch((window.PLUMBLINE_BASE||"/") + "pubkey.txt").then(function (r) { return r.text(); })
          .then(function (t) { PlumblineUI.text(document.getElementById("pubkey"), t.trim()); });
      });
    fetch((window.PLUMBLINE_BASE||"/") + "docs/VERIFY.md")
      .then(function (r) { return r.text(); })
      .then(function (t) { PlumblineUI.text(document.getElementById("doc"), t); })
      .catch(function (e) { PlumblineUI.text(document.getElementById("doc"), String(e)); });
  </script>
</body>
</html>
